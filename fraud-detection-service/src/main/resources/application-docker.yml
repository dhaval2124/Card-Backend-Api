# application-docker.yml
spring:
  datasource:
    url: jdbc:mysql://mysql-fraud:3306/cardmanagementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  kafka:
    bootstrap-servers: kafka-fraud:9092

---
# schema.sql
CREATE DATABASE IF NOT EXISTS cardmanagementdb;
USE cardmanagementdb;

CREATE TABLE IF NOT EXISTS transactions (
id BIGINT AUTO_INCREMENT PRIMARY KEY,
card_number VARCHAR(20) NOT NULL,
merchant_id VARCHAR(50) NOT NULL,
amount DECIMAL(10,2) NOT NULL,
transaction_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
location VARCHAR(100),
transaction_type VARCHAR(20) DEFAULT 'PURCHASE',
status VARCHAR(20) DEFAULT 'PENDING',
created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
);

CREATE TABLE IF NOT EXISTS fraud_alerts (
id BIGINT AUTO_INCREMENT PRIMARY KEY,
transaction_id BIGINT NOT NULL,
alert_type VARCHAR(50) NOT NULL,
risk_score DECIMAL(3,2) NOT NULL,
reason TEXT,
status VARCHAR(20) DEFAULT 'OPEN',
created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
FOREIGN KEY (transaction_id) REFERENCES transactions(id)
);

CREATE TABLE IF NOT EXISTS card_profiles (
id BIGINT AUTO_INCREMENT PRIMARY KEY,
card_number VARCHAR(20) NOT NULL UNIQUE,
daily_limit DECIMAL(10,2) DEFAULT 5000.00,
monthly_limit DECIMAL(12,2) DEFAULT 50000.00,
usual_locations TEXT,
created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
);

