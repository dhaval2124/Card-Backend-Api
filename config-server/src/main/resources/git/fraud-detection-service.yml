server:
  port: 8086

spring:
  application:
    name: fraud-detection-service
  datasource:
    url: jdbc:h2:mem:frauddb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

# Fraud detection specific configurations
fraud:
  detection:
    threshold:
      amount: 10000
      daily-limit: 50000
      velocity-limit: 5
