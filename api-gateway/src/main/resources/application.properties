# Server Configuration
server.port=8080

spring.cloud.config.enabled=false


# Spring Application Configuration
spring.application.name=api-gateway
spring.profiles.active=dev

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Spring Cloud Gateway Configuration (Updated properties)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10000

# Load Balancer Configuration
spring.cloud.loadbalancer.ribbon.enabled=false

# JWT Configuration
jwt.secret=cardManagementSecretKeyForJWTTokenGenerationAndValidation
jwt.expiration=86400000

# Logging Configuration
logging.level.com.cardmanagement=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG

# Management/Actuator Configuration (Updated)
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# Bean Definition Override (Fix for security conflict)
spring.main.allow-bean-definition-overriding=true

# WebFlux Configuration
spring.webflux.multipart.max-in-memory-size=10MB