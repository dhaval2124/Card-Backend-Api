spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/card_management_db
    username: root
    password: Dhaval@3679
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # Disable external service dependencies
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

server:
  port: 8081

# Disable Eureka
eureka:
  client:
    enabled: false

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cardmanagement.user_service: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n"
