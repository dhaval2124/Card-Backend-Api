spring:
  application:
    name: user-service

  # Make Config Server truly optional
  config:
    import: "optional:configserver:http://localhost:8888"

  # Disable Config Server for now
  cloud:
    config:
      fail-fast: false
      enabled: false

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/card_management_db
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

# Server Configuration
server:
  port: 8081

# Fix Eureka configuration (Disable for standalone mode)
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    enabled: false
  instance:
    prefer-ip-address: true

# Logging Configuration
logging:
  level:
    org.springframework.cloud.config: WARN
    org.hibernate: WARN