# Database Configuration for Docker
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/cardmanagementdb
spring.datasource.username=root
spring.datasource.password=Dhaval@3679

# Rest of your configuration...
spring.application.name=notification-service
server.port=8083
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Disable services not available in container
spring.cloud.config.enabled=false
spring.kafka.bootstrap-servers=host.docker.internal:9092
