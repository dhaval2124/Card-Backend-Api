# Server Configuration
server.port=8080
spring.application.name=card-service

# Database Configuration - Updated for your database
spring.datasource.url=jdbc:mysql://localhost:3306/cardmanagementdb
spring.datasource.username=root
spring.datasource.password=Dhaval@3679
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Config Server Configuration
spring.config.import=optional:configserver:http://localhost:8888

# Logging
logging.level.com.cardmanagement=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Validation
spring.jpa.defer-datasource-initialization=true

# Add this line to disable config server completely
spring.cloud.config.enabled=false



