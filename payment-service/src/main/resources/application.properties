# Application Configuration
spring.application.name=payment-service
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cardmanagementdb
spring.datasource.username=root
spring.datasource.password=Dhaval@3679
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Config Server Configuration
spring.config.import=optional:configserver:http://localhost:8888

# Feign Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
logging.level.com.cardmanagement.payment.feign=DEBUG

# User Service URL
user.service.url=http://localhost:8081

# Logging Configuration
logging.level.com.cardmanagement.payment=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# Add this line to disable config server entirely
spring.cloud.config.enabled=false

